
<!DOCTYPE html>
<html>
<head>
<style>
  body { height: 2000px; margin: 0; padding: 0; background: gray; }
  .chat-panel {
    position: fixed; bottom: 5.5rem; right: 2rem;
    width: 440px; height: calc(100vh - 8rem); max-height: 640px;
    display: flex; flex-direction: column; overflow: hidden; background: white;
  }
  .chat-messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 1.1rem;
    display: flex; flex-direction: column; gap: 0.9rem;
    overscroll-behavior: contain; background: lightblue;
  }
  .msg { height: 1000px; background: pink; }
</style>
</head>
<body>
  <div class="chat-panel">
    <div>Header</div>
    <div class="chat-messages">
      <div class="msg">Very tall message</div>
    </div>
    <div>Footer</div>
  </div>
</body>
</html>
